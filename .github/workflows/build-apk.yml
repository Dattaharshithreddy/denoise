name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          # Release when this version has no tag yet (or when a v* tag was pushed).
          if [[ "$GITHUB_REF" == refs/tags/v* ]] || ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "DO_RELEASE=true" >> "$GITHUB_ENV"
          fi

      # Optional: store your own signing key as repo secrets to replace the bundled one.
      - name: Signing key from secrets
        env:
          KS: ${{ secrets.HUSH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "HUSH_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          HUSH_STORE_PASSWORD: ${{ secrets.HUSH_STORE_PASSWORD }}
          HUSH_KEY_ALIAS: ${{ secrets.HUSH_KEY_ALIAS }}
          HUSH_KEY_PASSWORD: ${{ secrets.HUSH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Hush-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Hush-${{ env.VERSION_NAME }}
          path: Hush-*.apk

      - name: Publish GitHub release
        if: env.DO_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: Hush ${{ env.VERSION_NAME }}
          body_path: .github/release-notes.md
          files: Hush-*.apk
